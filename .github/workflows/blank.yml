name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./scopenbreak

      - name: Build Mod with Gradle
        run: ./gradlew build
        working-directory: ./scopenbreak

      - name: Upload Mod Jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: scopenbreak/build/libs/*.jar
